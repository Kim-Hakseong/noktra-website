name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (static export)
        env:
          # GitHub Pages는 /<repo> 서브경로로 서빙됨.
          # 커스텀 도메인(noktra.io) 연결 시 두 값을 도메인 기준으로 교체:
          #   NEXT_PUBLIC_BASE_PATH: ''  /  NEXT_PUBLIC_SITE_ORIGIN: https://noktra.io
          NEXT_PUBLIC_BASE_PATH: /noktra-website
          NEXT_PUBLIC_SITE_ORIGIN: https://kim-hakseong.github.io
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
